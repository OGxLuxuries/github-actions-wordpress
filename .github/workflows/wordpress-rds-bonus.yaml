name: WordPress_RDS_bonus

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation
        type: choice
        required: true
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read

concurrency:
  group: terraform-wordpress-rds-bonus
  cancel-in-progress: false

jobs:
  terraform:
    name: WordPress RDS ${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bonus
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format check
        run: terraform fmt -check -recursive
      - name: Initialize separate S3 state
        run: terraform init
      - name: Validate Terraform configuration
        run: terraform validate
      - name: Apply WordPress and RDS
        if: inputs.action == 'apply'
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          terraform output ec2_public_ip
          terraform output wordpress_url
      - name: Destroy WordPress and RDS
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve
